[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "titans-mac"
version = "0.2.0"
description = "Deep test-time memories: stability and collapse (paper A), and a memory branch grafted on a frozen Qwen2.5-VL (paper B)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# the graft (paper B) and the video encoders; the memory itself needs torch only
graft = ["transformers>=4.55", "huggingface_hub", "accelerate", "decord", "numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
