[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "titans-mac"
version = "0.1.0"
description = "From-scratch PyTorch reimplementation of Titans neural long-term memory + MAC (arXiv:2501.00663), an ATLAS Omega-rule sliding-window memory extension (arXiv:2505.23735), a Titans-MAC world model over frozen V-JEPA-2 video latents with long-term-memory ablations, and a synthetic associative-recall/copy/needle memory benchmark."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Needed to run src/titans/worldmodel/ against real video (encoder + Kinetics-mini /
# EgoLife loaders); titans.membench is pure torch and needs none of this. `decord`
# is what actually works for video decoding in this environment; `torchcodec` (a
# more modern alternative) failed to load here because the system has no `ffmpeg` /
# `libavutil.so.56` -- with a working ffmpeg it may be a viable swap-in, but nothing
# in this repo currently imports it.
worldmodel = [
    "transformers>=4.55",
    "huggingface_hub",
    "decord",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
